
name: Webnovel Translation Monitor
on:
  schedule:
    - cron: '*/5 * * * *' # Automatically runs an internal sweep every 5 minutes
  workflow_dispatch: # Allows you to manually trigger a test block

permissions:
  contents: write # Grants the script permission to commit last_chapter.txt back to your repo

jobs:
  monitor-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo state
        uses: actions/checkout@v4

      - name: Fetch Updates and Ping Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Grabs layout from the dedicated updates folder timeline
          HTML_DATA=$(curl -sL "https://ashtlsrezero.site")
          
          # Extracts the absolute newest text heading line cleanly without needing rigid character matching
          LATEST_CHAPTER=$(echo "$HTML_DATA" | grep -oE "### Arc [0-9]+ Chapter [0-9]+.*" | head -n 1 | sed 's/### //g' | cut -d'<' -f1)
          
          if [ -n "$LATEST_CHAPTER" ]; then
            echo "Current live release: $LATEST_CHAPTER"
            
            # Check against the last recorded update file stored in your repo
            if [ ! -f last_chapter.txt ] || [ "$LATEST_CHAPTER" != "$(cat last_chapter.txt)" ]; then
              echo "New chapter drop detected!"
              
              # Save the state instantly to prevent repeating
              echo "$LATEST_CHAPTER" > last_chapter.txt
              
              # Safely handle single quotes and special characters via clean variables
              MSG_CONTENT=$(cat <<EOF
          @everyone 
          
          the stars haven’t abandoned us! a new chapter has been translated ✨
          
          📖 **${LATEST_CHAPTER}**
          🌐 https://ashtlsrezero.site
          EOF
          )
              
              # Safely build payload escaped via jq to prevent shell execution failures
              JSON_PAYLOAD=$(jq -n --arg msg "$MSG_CONTENT" '{username: "Aldebaran", avatar_url: "https://discordapp.com", content: $msg}')
              
              # Fire directly to your channel hook secret
              curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK_URL"
              
              # Commit history state back to git tracking so the bot remembers next time
              git config --global user.name "GitHub Actions"
              git config --global user.email "actions@github.com"
              git add last_chapter.txt
              git commit -m "Update state: $LATEST_CHAPTER" || true
              git push || true
            else
              echo "No change found. Already handled."
            fi
          fi
