
name: Webnovel Translation Monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo state
        uses: actions/checkout@v4

      - name: Fetch Updates and Ping Webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          HTML_DATA=$(curl -sL "https://ashtlsrezero.site/updates")
          LATEST_CHAPTER=$(echo "$HTML_DATA" | grep -oE "<h3[^>]*>[^<]+</h3>" | head -n 1 | sed -E 's/<[^>]+>//g' | python3 -c "import sys, html; print(html.unescape(sys.stdin.read().strip()))")
          
          if [ -n "$LATEST_CHAPTER" ]; then
            echo "Current live release: $LATEST_CHAPTER"
            
            if [ ! -f last_chapter.txt ] || [ "$LATEST_CHAPTER" != "$(cat last_chapter.txt)" ]; then
              echo "New chapter drop detected!"
              echo "$LATEST_CHAPTER" > last_chapter.txt
              
              # Routes Arc 10 to @Current Arc Updates and everything else to @Miscellaneous Pings
              if [[ "$LATEST_CHAPTER" == *"Arc 10"* ]]; then
                ROLE_PING="<@&1569955443558711296>"
              else
                ROLE_PING="<@&1569951370818228275>"
              fi
              
              MSG_CONTENT=$(printf "%s\n\nthe stars haven’t abandoned us! a new chapter has been translated ✨\n\n📖 **%s**\n🌐 https://ashtlsrezero.site/updates" "$ROLE_PING" "$LATEST_CHAPTER")
              JSON_PAYLOAD=$(jq -n --arg msg "$MSG_CONTENT" '{username: "Aldebaran", content: $msg}')
              
              curl -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK_URL"
              
              git config --global user.name "GitHub Actions"
              git config --global user.email "actions@github.com"
              git add last_chapter.txt
              git commit -m "Update state: $LATEST_CHAPTER" || true
              git push || true
            else
              echo "No change found. Already handled."
            fi
          else
            echo "Could not find any chapter text on the page."
          fi
